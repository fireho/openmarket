# lib:  the plain-Ruby specs — no Rails, no Mongo, so they run anywhere.
# host: the engine in spec/dummy, a host as small as one gets, on a real Mongo.
name: specs

on:
  push:
  pull_request:

jobs:
  lib:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bin/rspec spec/lib

  host:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      MONGO_TEST_DB: openmarket_ci
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bin/rspec spec/models spec/requests spec/routing
